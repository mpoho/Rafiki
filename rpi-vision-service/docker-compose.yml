version: '3.8'

services:
  rpi-vision:
    build: .
    container_name: rpi-vision-service
    restart: always
    ports:
      - "8000:8000"
    devices:
      - "/dev/video0:/dev/video0"
    environment:
      - CAMERA_TYPE=auto
      - CAMERA_INDEX=0
      - DEFAULT_WIDTH=1280
      - DEFAULT_HEIGHT=720
      - DEFAULT_QUALITY=85
